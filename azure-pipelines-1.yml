# Check outbound network reachability

trigger:
- master

pool:
  vmImage: windows-latest

steps:
- script: echo Hello, world!
  displayName: 'Run a one-line script'

- script: |
    Test-NetConnection -ComputerName horizons.jpl.nasa.gov -Port 6775
    Test-NetConnection -ComputerName telehack.com -Port 23
  displayName: 'Check outbound telnet reachability'
  continueOnError: true

- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      Test-NetConnection -ComputerName horizons.jpl.nasa.gov -Port 6775
      Test-NetConnection -ComputerName telehack.com -Port 23
  displayName: 'Check outbound telnet reachability - PS'